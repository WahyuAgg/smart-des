info:
  name: Update by ID
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/papers/{{paper_id}}"
  body:
    type: multipart-form
    data:
      - name: _method
        type: text
        value: PUT
      - name: judul
        type: text
        value: "  Informasi Desa untuk Meningkatkan Pelayanan Publik"
      - name: slug
        type: text
        value: pemanfaatan-sistem-informasi-desa-untuk-meningkatkan-pelayanan-publik
      - name: ringkasan
        type: text
        value: Penelitian ini membahas implementasi sistem informasi desa dalam meningkatkan efisiensi administrasi, transparansi, dan kualitas pelayanan kepada masyarakat.
      - name: nama_penulis
        type: text
        value: Ahmad Fauzan
      - name: tahun
        type: text
        value: "2026"
      - name: pdf
        type: file
        value:
          - C:\agg\projects\KKN\asset\sample_pdf_doc.pdf
        contentType: application/pdf
      - name: thumbnail
        type: file
        value:
          - C:\agg\projects\KKN\asset\images_lanscape.jpg
        contentType: image/jpeg
      - name: jumlah_halaman
        type: text
        value: "12"
      - name: status
        type: text
        value: published
  auth: inherit

runtime:
  variables:
    - name: paper_id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

