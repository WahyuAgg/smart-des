info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/galeri"
  body:
    type: multipart-form
    data:
      - name: judul
        type: text
        value: 17 agustus 2026
      - name: deskripsi
        type: text
        value: hari kemerdekaan
      - name: file
        type: file
        value:
          - C:\agg\projects\KKN\asset\images_lanscape.jpg
        contentType: image/jpeg
      - name: tanggal
        type: text
        value: 2026-07-29
      - name: is_published
        type: text
        value: "1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/galeri"
      method: POST
      body:
        type: multipart-form
        data:
          - name: judul
            type: text
            value: pengajian
          - name: deskripsi
            type: text
            value: pengajian khataman quran
          - name: file
            type: file
            value:
              - C:\agg\projects\KKN\asset\images_lanscape.jpg
            contentType: image/jpeg
          - name: tanggal
            type: text
            value: 2026-07-29
          - name: is_published
            type: text
            value: "1"
    response:
      status: 201
      statusText: Created
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 29 Jul 2026 16:16:40 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KYQAKVT0HD80CRD0J1EX4YHV
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Galeri berhasil ditambahkan.",
