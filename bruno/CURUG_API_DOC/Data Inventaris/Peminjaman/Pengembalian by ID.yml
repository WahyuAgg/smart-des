    data: |-
      {
        "returns": [
          {
            "barang_id": 17,
            "jumlah_kembali": 0,
            "jumlah_hilang": 0
          },
          {
            "barang_id": 18,
            "jumlah_kembali": 1,
            "jumlah_hilang": 1
          }
