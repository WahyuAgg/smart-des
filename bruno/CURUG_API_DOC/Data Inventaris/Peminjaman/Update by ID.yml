info:
  name: Update by ID
  type: http
  seq: 6

http:
  method: PUT
  url: "{{base_url}}/api/inv-peminjaman/{{id_peminjaman}}"
  body:
    type: json
    data: |-
      {
        "nama_peminjam": "Budi Santoso edited",
        "tanggal_pinjam": "2026-07-27",
        "tanggal_rencana_kembali": "2026-09-03",
        "keterangan": "Peminjaman acara pengajian edited"
      }
  auth: inherit

runtime:
  variables:
    - name: id_peminjaman
      value: "15"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

