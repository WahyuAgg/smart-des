info:
  name: Show by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/ref-rw/{{ref_rw_id}}"
  auth: inherit

runtime:
  variables:
    - name: ref_dusun_id
      value: "1"
    - name: ref_rw_id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

