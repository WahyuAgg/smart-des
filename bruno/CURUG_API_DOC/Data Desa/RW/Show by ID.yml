          value: no-cache, private
        - name: date
          value: Mon, 27 Jul 2026 13:23:53 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KYHVY232E4WXW73E4KP823H2
