info:
  name: Show by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/ref-perangkat-desa/{{id_perangkat_desa}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: id_perangkat_desa
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

