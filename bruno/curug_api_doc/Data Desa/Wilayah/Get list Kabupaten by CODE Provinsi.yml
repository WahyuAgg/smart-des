info:
  name: Get list Kabupaten by CODE Provinsi
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/wilayah?level=kabupaten&parent={{code_provinsi}}&search={{keywords}}"
  params:
    - name: level
      value: kabupaten
      type: query
    - name: parent
      value: "{{code_provinsi}}"
      type: query
    - name: search
      value: "{{keywords}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: code_provinsi
      value: "31"
    - name: keywords
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/wilayah?level=kabupaten&parent={{code_provinsi}}&search="
      method: GET
      params:
        - name: level
          value: kabupaten
          type: query
        - name: parent
          value: "{{code_provinsi}}"
          type: query
        - name: search
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sun, 12 Jul 2026 15:52:49 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KXBGFZRE81HHHW186R5K478Q
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Success",
            "data": [
              {
                "value": "1105",
                "label": "KABUPATEN ACEH BARAT"
              },
              {
                "value": "1112",
                "label": "KABUPATEN ACEH BARAT DAYA"
              },
              {
                "value": "1106",
                "label": "KABUPATEN ACEH BESAR"
              }
