info:
  name: Get list Kecamatan by CODE Kabupaten
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/wilayah?level=kecamatan&parent={{code_kabupated}}&search={{keywords}}"
  params:
    - name: level
      value: kecamatan
      type: query
    - name: parent
      value: "{{code_kabupated}}"
      type: query
    - name: search
      value: "{{keywords}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: level
      value: kecamatan
    - name: code_kecamatan
      value: "1105"
    - name: keywords
      value: ""
    - name: code_kabupated
      value: "3306"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

