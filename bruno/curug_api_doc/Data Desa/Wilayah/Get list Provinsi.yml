info:
  name: Get list Provinsi
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/wilayah?level=provinsi&search={{keywords}}"
  params:
    - name: level
      value: provinsi
      type: query
    - name: search
      value: "{{keywords}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: level
      value: provinsi
    - name: keywords
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/wilayah?level=provinsi&search="
      method: GET
      params:
        - name: level
          value: provinsi
          type: query
        - name: search
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
