info:
  name: Show by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/ref-dusun/{{id_ref_dusun}}"
  auth: inherit

runtime:
  variables:
    - name: ref_dusun_id
      value: "1"
    - name: id_ref_dusun
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/ref-dusun/{{id_ref_dusun}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Mon, 27 Jul 2026 12:29:33 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KYHRTJFCZXMB5FS0F154PAGJ
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Success",
            "data": {
              "id": 1,
              "nama": "Curug",
              "kepala_dusun": "Budi Santoso",
              "ref_rw": [
                {
                  "id": 1,
                  "dusun_id": 1,
                  "nomor_rw": "001",
                  "ketua_rw": "Slamet Riyadi"
                },
                {
