info:
  name: Show by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/ref-rt/{{ref_rt_id}}"
  auth: inherit

runtime:
  variables:
    - name: ref_dusun_id
      value: "1"
    - name: ref_rw_id
      value: "2"
    - name: ref_rt_id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/ref-rt/{{ref_rt_id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Mon, 27 Jul 2026 13:25:21 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KYHW0QFEVGJF6DE2NCV35Z1Y
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Success",
            "data": {
              "id": 1,
              "rw_id": 1,
              "nomor_rt": "001",
              "ketua_rt": "Joko Santoso",
              "ref_rw": {
                "id": 1,
                "dusun_id": 1,
                "desa_id": null,
                "nomor_rw": "001",
                "ketua_rw": "Slamet Riyadi",
                "ref_dusun": {
                  "id": 1,
                  "nama": "Curug",
                  "kepala_dusun": "Budi Santoso"
                }
              }
            }
          }
