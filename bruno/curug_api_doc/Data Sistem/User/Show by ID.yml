info:
  name: Show by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/users/{{user_id}}"
  auth: inherit

runtime:
  variables:
    - name: user_id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

