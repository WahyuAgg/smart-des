info:
  name: Show by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/pendidikan/{{id}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/pendidikan/{{id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sun, 12 Jul 2026 19:21:00 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KXBWD61TS8FFW9CVTP3PZ195
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Success",
            "data": {
              "id": 1,
              "tingkat_pendidikan": "Tidak/Belum Sekolah"
            }
          }
