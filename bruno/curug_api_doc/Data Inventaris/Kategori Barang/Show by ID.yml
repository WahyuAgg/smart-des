info:
  name: Show by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/inv-kategori-barang/{{id_inv_kategori_barang}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: id_inv_kategori_barang
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/inv-kategori-barang"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "nama" : "Elektronik",
            "keterangan" : "Barang elektronik"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sun, 26 Jul 2026 09:14:50 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KYEV99W0NR5QMRGDK4SDQ914
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Kategori barang berhasil ditambahkan.",
            "data": {
              "nama": "Elektronik",
              "keterangan": "Barang elektronik",
              "id": 1
            }
          }
