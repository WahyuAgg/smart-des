info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/inv-lokasi/"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "nama" : "Gudang PKK 2",
        "keterangan" : "Tempat simpan barang-barang PKK"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
