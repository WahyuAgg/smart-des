info:
  name: Update by ID
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/inv-lokasi/{{id_inv_lokasi}}"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "nama" : "Gudang Balai desa",
        "keterangan" : "Tempat simpan barang desa edited"
      }
  auth: inherit

runtime:
  variables:
    - name: id_inv_lokasi
      value: "1"

settings:
