info:
  name: Hapus stock by ID
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/api/inv-barang/{{id_inv_barang}}/hapus-stok"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "jumlah" : 2,
        "keterangan" : "hapus stok barang laptop"
      }
  auth: inherit

runtime:
  variables:
    - name: id_inv_barang
      value: "15"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

