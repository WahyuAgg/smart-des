info:
  name: Get all, search, pagination
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/penduduk?search={{keywords}}&per_page={{per_page}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: search
      value: "{{keywords}}"
      type: query
    - name: per_page
      value: "{{per_page}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

