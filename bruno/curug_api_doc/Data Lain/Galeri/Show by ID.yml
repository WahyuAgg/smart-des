info:
  name: Show by ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/galeri/{{galeri_id}}"
  auth: inherit

runtime:
  variables:
    - name: galeri_id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/galeri/{{galeri_id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 29 Jul 2026 16:23:16 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KYQAZZ09RAJP6JXDT5ZMS7BP
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Success",
            "data": {
              "id": 1,
              "judul": "pengajian",
              "deskripsi": "pengajian khataman quran",
              "tanggal": "2026-07-29T00:00:00.000000Z",
              "is_published": true,
              "image_url": "http://localhost:8000/storage/galeri/OJCHQSxSpMlhmfYfQ03sImWQBD8bmyZapa0AxRyt.jpg"
