info:
  name: step 2 Show jenis surat by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/srt-jenis-surat/{{jenis_surat_id}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: jenis_surat_id
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

