info:
  name: Step 4 Generate surat by ID pengajuan surat (kirim data field)
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/pengajuan-surat/{{pengajuan_surat_id}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: level
      value: kabupaten
      type: query
      disabled: true
    - name: level
      value: kecamatan
      type: query
      disabled: true
    - name: level
      value: desa
      type: query
      disabled: true
    - name: parent
      value: ""
      type: query
      disabled: true
    - name: search
      value: ""
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
          "data_surat": {
              "tujuan": "Pembuatan BPJS",
              "catatan": "Mohon diproses secepatnya"
          }
      }
  auth: inherit

runtime:
  variables:
    - name: pengajuan_surat_id
      value: "55"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

