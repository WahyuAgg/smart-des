info:
  name: Update by ID
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/srt-kategori-surat/{{id_srt_kategori_surat}}"
  body:
    type: json
    data: |-
      {
        "kode_kategori_surat": "Gen",
        "nama_kategori_surat": "General",
        "deskripsi": "Surat semua kebutuhan edited",
        "is_active": false
      }
  auth: inherit

runtime:
  variables:
    - name: id_srt_kategori_surat
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
