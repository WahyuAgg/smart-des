info:
  name: Show by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/srt-kategori-surat/{{id_srt_kategori_surat}}"
  auth: inherit

runtime:
  variables:
    - name: id_srt_kategori_surat
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{base_url}}/api/srt-kategori-surat/{{id_srt_kategori_surat}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Mon, 27 Jul 2026 10:53:14 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
        - name: phpdebugbar-id
          value: 01KYHKA78RE9VXB4PZYGRN6BG2
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Success",
            "data": {
              "id": 1,
              "kode_kategori_surat": "KET",
              "nama_kategori_surat": "Surat Keterangan",
              "deskripsi": "Berbagai surat yang menerangkan suatu kondisi, status, atau keadaan seseorang.",
              "is_active": true
            }
          }
