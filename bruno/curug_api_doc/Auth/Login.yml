info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \  \"email\": \"admin@desa.id\",\r

      \  \"password\": \"admin123\"\r

      }\r\n"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body.token) {
            bru.setVar("access_token", body.token);
        console.log("✅ Token saved:",bru.getVar('access_token'))           // Runtime variables
        } else {
            console.warn("⚠️ 'token' key not found.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
