info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/inv-kategori-barang"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "nama" : "Alat Makan",
        "keterangan" : "Alat makan milik PKK"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
