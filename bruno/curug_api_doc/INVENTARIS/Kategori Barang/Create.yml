    request:
      url: "{{base_url}}/api/inv-kategori-barang"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "nama" : "Elektronik",
            "keterangan" : "Barang elektronik"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.2.29
        - name: cache-control
          value: no-cache, private
