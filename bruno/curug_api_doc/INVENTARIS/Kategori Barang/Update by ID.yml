info:
  name: Update by ID
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/inv-kategori-barang/{{id_inv_kategori_barang}}"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "nama" : "Barang Elektronik",
        "keterangan" : "Barang elektronik milik desa"
      }
  auth: inherit

runtime:
  variables:
    - name: id_inv_kategori_barang
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

