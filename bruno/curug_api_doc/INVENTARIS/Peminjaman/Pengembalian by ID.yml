info:
  name: Pengembalian by ID
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/inv-peminjaman/{{id_peminjaman}}/kembalikan"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "returns": [
              {
            "barang_id": 17,
            "jumlah_kembali": 5,
            "jumlah_hilang": 0
          }
        ]
      }
  auth: inherit

runtime:
  variables:
    - name: id_peminjaman
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

