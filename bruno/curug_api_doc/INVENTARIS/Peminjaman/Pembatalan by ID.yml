info:
  name: Pembatalan by ID
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/inv-peminjaman/{{id_peminjaman}}/batalkan"
  auth: inherit

runtime:
  variables:
    - name: id_peminjaman
      value: "4"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

